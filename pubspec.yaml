name: agrivet
description: AI-powered agricultural diagnostic app for African farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TFLite inference
  tflite_flutter: ^0.11.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.1.7

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.10

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.3.3
  url_launcher: ^6.2.5

  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/animal_model.tflite
    - assets/models/plant_model.tflite
    - assets/data/animal_classes.json
    - assets/data/plant_classes.json
    - assets/data/disease_info.json
    - assets/data/disease_knowledge_base.json
    - assets/translation/setswana.json