name: agrivet
description: AI-powered agricultural diagnostic app for African farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TFLite inference
  tflite_flutter: ^0.11.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.1.7

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.10
  firebase_messaging: ^14.9.4
  google_sign_in: ^6.1.0

  # Notifications shown while the app is open (Android)
  flutter_local_notifications: ^18.0.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  http: ^1.2.0
  share_plus: ^9.0.0

  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Firebase stubs for the screenshot tests (test_screenshots/)
  firebase_core_platform_interface: ^5.0.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/models/animal_model.tflite
    - assets/models/plant_model.tflite
    - assets/data/animal_classes.json
    - assets/data/plant_classes.json
    - assets/data/disease_info.json
    - assets/data/disease_knowledge_base.json
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E3A"
  # Leaf only, at 46% of the canvas so launchers that crop to a circle or
  # squircle keep it inside the safe zone (the full app_icon.png is too big).
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"