name: Translate content

# Re-generates assets/i18n/<code>.json with NLLB whenever the English source,
# the language list, the human overrides or the script change, then commits
# the result back to the same branch. Only changed strings are re-translated.
on:
  pull_request:
    paths:
      - assets/data/disease_knowledge_base.json
      - assets/i18n/en.json
      - assets/i18n/languages.json
      - assets/i18n/overrides/**
      - scripts/translate.py
      - .github/workflows/translate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    # Commits back to the PR branch, so only run for branches in this repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-translate.txt

      - name: Install CPU-only PyTorch and transformers
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-translate.txt

      - name: Cache the NLLB model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nllb-200-distilled-600M

      - name: Translate
        run: python scripts/translate.py

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n scripts/i18n_cache
          if git diff --cached --quiet; then
            echo "Translations already up to date."
          else
            git commit -m "Update machine translations (NLLB)"
            git push
          fi
