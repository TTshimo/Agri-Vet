name: Translate content

# Re-generates assets/i18n/<code>.json with NLLB whenever the English source,
# the language list, the human overrides or the script change, then commits
# the result back to the same branch. Each language runs as its own job in
# parallel; only new or changed English strings are re-translated.
on:
  pull_request:
    paths:
      - assets/data/disease_knowledge_base.json
      - assets/i18n/en.json
      - assets/i18n/languages.json
      - assets/i18n/overrides/**
      - scripts/translate.py
      - .github/workflows/translate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  languages:
    # Commits back to the PR branch, so only run for branches in this repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      codes: ${{ steps.list.outputs.codes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - id: list
        run: echo "codes=$(jq -c '[.[] | select(.code != "en") | .code]' assets/i18n/languages.json)" >> "$GITHUB_OUTPUT"

  translate:
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        code: ${{ fromJson(needs.languages.outputs.codes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-translate.txt

      - name: Install CPU-only PyTorch and transformers
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-translate.txt

      - name: Cache the NLLB model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nllb-200-distilled-600M

      - name: Translate ${{ matrix.code }}
        run: python scripts/translate.py --only ${{ matrix.code }}

      - uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ matrix.code }}
          path: |
            assets/i18n/${{ matrix.code }}.json
            scripts/i18n_cache/${{ matrix.code }}.json
          if-no-files-found: ignore

  commit:
    needs: translate
    if: always() && needs.translate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: i18n-*
          path: translated
          merge-multiple: true

      - name: Commit translations
        run: |
          if [ -d translated/assets ]; then cp -r translated/assets/i18n/. assets/i18n/; fi
          if [ -d translated/scripts ]; then cp -r translated/scripts/i18n_cache/. scripts/i18n_cache/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n scripts/i18n_cache
          if git diff --cached --quiet; then
            echo "Translations already up to date."
            exit 0
          fi
          git commit -m "Update machine translations (NLLB)"
          # Someone may have pushed while we were translating.
          git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
